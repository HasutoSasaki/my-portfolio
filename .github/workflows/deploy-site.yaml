name: Deploy site

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    paths-ignore:
      - 'infra/**'
      - '.github/**'
      - 'README.md'
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'HasutoSasaki/my-portfolio'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run build
      - name: Check static output
        run: test -s out/index.html
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: static-site
          path: out/
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.repository == 'HasutoSasaki/my-portfolio' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Check deployment setup
        env:
          ENABLE_SITE_DEPLOY: ${{ vars.ENABLE_SITE_DEPLOY }}
        run: |
          if [[ "$ENABLE_SITE_DEPLOY" != "true" ]]; then
            echo "::error::Set ENABLE_SITE_DEPLOY=true only after the restricted AWS OIDC role and branch protection are ready."
            exit 1
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: static-site
          path: out/
      - name: Check downloaded output
        run: test -s out/index.html
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::078072735979:role/my-portfolio-github-deploy
          aws-region: ap-northeast-1
          allowed-account-ids: '078072735979'
          role-duration-seconds: 900
          mask-aws-account-id: true
          unset-current-credentials: true
      - name: Upload static site
        run: |
          aws --version
          aws s3 sync out/ s3://www.hasutosasaki.com/ --no-follow-symlinks --only-show-errors
      - name: Refresh CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E1DZXZ1TJCQU0K \
            --paths '/*' \
            --query 'Invalidation.Id' \
            --output text
